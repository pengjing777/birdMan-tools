apply plugin: 'com.android.application'

android {
    namespace 'com.birdstools.android'
    compileSdk 33

    defaultConfig {
        applicationId 'com.birdstools.android'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
