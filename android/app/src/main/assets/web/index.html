<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI观鸟</title>
<style>
:root{--ink:#172b2a;--muted:#718381;--green:#1d6b5b;--pale:#eaf4ef;--line:#dce8e3;--bg:#f6faf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:66px;background:var(--green);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}header h1{font-size:20px;margin:0}header small{opacity:.75}.wrap{max-width:760px;margin:auto;padding:26px 16px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 24px #1746380d}h2{margin:0 0 8px;font-size:23px}.sub,.hint{color:var(--muted);font-size:14px;line-height:1.6}.form{display:grid;gap:14px;margin-top:20px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fbfdfc;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:var(--green)}button{border:0;border-radius:12px;padding:13px 16px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.chat{display:grid;gap:14px;margin:18px 0}.bubble{max-width:92%;padding:13px 15px;border-radius:16px;line-height:1.7;white-space:pre-wrap}.q{justify-self:end;background:var(--green);color:#fff;border-bottom-right-radius:5px}.a{justify-self:start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}.tag{display:inline-block;color:var(--green);background:var(--pale);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;margin:10px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}.toolbar button{background:transparent;color:var(--muted);padding:5px 0;font-size:13px}.empty{text-align:center;color:var(--muted);padding:30px}.key-note{font-size:13px;color:var(--muted)}.error{color:#b42318;font-size:14px}
</style></head><body><header><div><h1>🪶 AI 观鸟</h1><small>随时问问你的观鸟顾问</small></div><span>🔭</span></header><main class="wrap">
<section id="setup" class="card"><span class="tag">首次使用</span><h2>配置 DeepSeek Key</h2><p class="sub">输入你的 DeepSeek API Key，保存后即可开始 AI 观鸟对话。Key 只保存在本机的安全存储中，不会显示在聊天页面。</p><div class="form"><input id="key" type="password" placeholder="sk-..." autocomplete="off"><button onclick="saveKey()">保存并开始对话</button><div id="keyError" class="error"></div><div class="key-note">需要先在 DeepSeek 开放平台创建 API Key，并确保账户有可用额度。</div></div></section>
<section id="chatPage" hidden><div class="toolbar"><div><h2>AI 观鸟问答</h2><div class="sub">可以问鸟种识别、习性、分布或观鸟技巧</div></div><button onclick="clearChat()">清空记录</button></div><div id="chat" class="chat"></div><div class="card form"><textarea id="question" rows="3" placeholder="例如：春天在城市公园看到一只黄绿色的小鸟，可能是什么？" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask()}"></textarea><button id="send" onclick="ask()">发送问题</button><div class="hint">已保留最近 10 条问答 · Enter 发送，Shift + Enter 换行</div></div></section></main>
<script>
window.Native=window.Native||{hasKey:()=>false,saveKey:()=>'',history:()=> '[]',ask:()=>setTimeout(()=>onAiAnswer('浏览器预览模式，无法连接 DeepSeek'),100),clearHistory:()=>{}};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(v){try{return typeof v==='string'?JSON.parse(v):v}catch(e){return[]}}function show(){const ready=Native.hasKey();$('setup').hidden=ready;$('chatPage').hidden=!ready;if(ready)render()}function saveKey(){const error=Native.saveKey($('key').value);if(error){$('keyError').textContent=error;return}$('key').value='';show()}function render(){const rows=parse(Native.history());$('chat').innerHTML=rows.length?rows.map(x=>'<div class="bubble q">'+esc(x.question)+'</div><div class="bubble a">'+esc(x.answer)+'</div>').join(''):'<div class="empty">👋 你好！我是你的 AI 观鸟顾问。<br>从一个鸟类问题开始吧。</div>';window.scrollTo(0,document.body.scrollHeight)}function ask(){const q=$('question').value.trim();if(!q)return;$('question').value='';$('send').disabled=true;$('send').textContent='正在思考…';$('chat').insertAdjacentHTML('beforeend','<div class="bubble q">'+esc(q)+'</div><div id="pending" class="bubble a">正在观察资料…</div>');window.scrollTo(0,document.body.scrollHeight);Native.ask(q)}window.onAiAnswer=function(answer){const p=$('pending');if(p)p.remove();$('chat').insertAdjacentHTML('beforeend','<div class="bubble a">'+esc(answer)+'</div>');$('send').disabled=false;$('send').textContent='发送问题';render()};function clearChat(){if(confirm('清空全部问答记录？')){Native.clearHistory();render()}}show();
</script></body></html>
