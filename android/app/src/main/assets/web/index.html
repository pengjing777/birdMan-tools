idth:0;max-width:100%}.bubble{min-width:0;max-width:89%;padding:13px 15px;border-radius:18px;line-height:1.65;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.question{justify-self:end;background:linear-gradient(135deg,#087884,var(--green2));color:#fff;border-bottom-right-radius:5px;box-shadow:0 5px 13px #17705e20}.answer{width:89%;max-width:89%;justify-self:start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 5px 13px #123f3708}.failed{color:var(--danger);background:#fff7f5;border-color:#f0d7d2}.thinking{display:flex;align-items:center;gap:5px;color:var(--muted)}.dot{width:6px;height:6px;background:var(--green2);border-radius:50%;animation:pulse 1.2s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}.composer-wrap{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#f3f7f5 18%)}.composer{width:min(730px,100%);max-width:100%;margin:auto;display:flex;align-items:flex-end;gap:9px;padding:8px 8px 8px 14px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 28px #123f371c}.composer textarea{flex:1;min-width:0;max-height:120px;min-height:42px;resize:none;border:0;outline:0;padding:10px 0;background:transparent;color:var(--ink);line-height:1.45}.send{width:46px;height:46px;flex:none;border:0;border-radius:15px;background:linear-gradient(145deg,#087884,var(--green));color:#fff;font-size:20px;font-weight:700}.send:disabled{opacity:.5}.count{text-align:center;color:var(--muted);font-size:11px;margin-bottom:5px}.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:#102c27a8;backdrop-filter:blur(4px)}.captcha-card{width:min(390px,100%);padding:22px}.captcha-card h2{margin:0 0 8px;font-size:21px}.captcha-image{width:100%;height:105px;object-fit:contain;margin:15px 0;border:1px solid var(--line);border-radius:13px;background:#f8faf9}.captcha-actions{display:grid;grid-template-columns:1fr 1.15fr;gap:9px}.secondary{min-height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--green);font-weight:700}.captcha-loading{height:105px;display:grid;place-items:center;margin:15px 0;color:var(--muted);font-size:13px}[hidden]{display:none!important}
  .query-meta{justify-self:start;max-width:100%;color:var(--green);font-size:11px;padding:0 4px;margin-top:-4px;overflow-wrap:anywhere}.answer{white-space:normal}.answer .md{min-width:0;max-width:100%;overflow:hidden}.answer .md>*:first-child{margin-top:0}.answer .md>*:last-child{margin-bottom:0}.answer .md p{margin:.62em 0}.answer .md h1,.answer .md h2,.answer .md h3{margin:1em 0 .45em;color:var(--forest);line-height:1.35}.answer .md h1{font-size:19px}.answer .md h2{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:5px}.answer .md h3{font-size:15px}.answer .md ul,.answer .md ol{margin:.55em 0;padding-left:1.45em}.answer .md li{margin:.3em 0;padding-left:.12em}.answer .md strong{color:#0d584a}.answer .md em{color:#4e6661}.answer .md blockquote{margin:.7em 0;padding:8px 11px;border-left:3px solid var(--green2);border-radius:0 8px 8px 0;background:#f0f7f4;color:#526762}.answer .md code{padding:2px 5px;border-radius:5px;background:#edf3f1;color:#9a4d18;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}.answer .md pre{max-width:100%;overflow:auto;margin:.75em 0;padding:11px;border-radius:10px;background:#173a34;color:#eaf4f1;line-height:1.5}.answer .md pre code{padding:0;background:transparent;color:inherit}.answer .md a{color:#087884;text-decoration:none;border-bottom:1px solid #08788455;overflow-wrap:anywhere}.answer .md hr{border:0;border-top:1px solid var(--line);margin:1em 0}.md-table{width:100%;max-width:100%;overflow:hidden;margin:.8em 0;border:1px solid var(--line);border-radius:9px}.answer .md table{width:100%;max-width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px;white-space:normal}.answer .md th,.answer .md td{min-width:0;padding:7px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}.answer .md th{background:#eaf4f0;color:var(--forest)}.answer .md tr:last-child td{border-bottom:0}.answer .md th:last-child,.answer .md td:last-child{border-right:0}.menu-panel{width:170px}.preferences-card{width:min(430px,100%);padding:22px}.preferences-card h2{margin:0 0 6px;font-size:21px}.preferences-grid{display:grid;gap:10px;margin:17px 0}.preferences-grid label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:700}.preferences-grid input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdfc;color:var(--ink);outline:0}.preferences-grid input:focus{border-color:var(--green2);box-shadow:0 0 0 3px #23846d18}.preferences-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.preferences-actions button{padding-left:8px;padding-right:8px}.composer-tools{width:min(730px,100%);max-width:100%;margin:0 auto 5px;display:flex;align-items:center;justify-content:space-between;gap:10px}.quick-actions{display:flex;align-items:center;gap:7px}.pref-quick,.clear-quick{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;color:var(--green);font-size:11px;font-weight:700;box-shadow:0 3px 10px #123f3708}.pref-quick:active{background:var(--mist)}.clear-quick{color:var(--danger);border-color:#f0d7d2}.clear-quick:active{background:#fff7f5}.light-theme{--forest:#254b57;--green:#397f8b;--green2:#66aeb4;--mist:#f6faf9;--paper:#fff;--ink:#294149;--muted:#7b8d90;--line:#e0ecec;--gold:#d9b47c;--orange:#dca88f;--danger:#b86a65}.topbar{background:linear-gradient(135deg,#365e69,#6caeb0);border-bottom:2px solid #e8c8ac}.topbar .brand span{color:#edf9f8}.icon-btn{background:#ffffff2b}.shell{background:transparent}.card,.answer{box-shadow:0 8px 24px rgba(58,105,112,.08)}.question{background:linear-gradient(135deg,#72adb0,#4d9098);box-shadow:0 5px 13px rgba(57,119,128,.15)}.send{background:linear-gradient(145deg,#5ea5aa,#3e858f)}.composer-wrap{background:linear-gradient(transparent,#f6faf9 24%)}.welcome{border-top-color:#e8c8ac}.eyebrow{background:#edf7f6;color:#397f8b}.answer .md strong{color:#2d6975}.suggestions button{border-color:#dceeee;background:#f7fbfb;color:#397f8b}.suggestions button:before{color:#d9a27f}.pref-quick,.clear-quick{box-shadow:0 3px 10px rgba(58,105,112,.08)}
  /* Light, low-saturation Kingfisher palette */
  :root{--forest:#254b57;--green:#397f8b;--green2:#66aeb4;--mist:#f6faf9;--paper:#fff;--ink:#294149;--muted:#7b8d90;--line:#e0ecec;--gold:#d9b47c;--orange:#dca88f;--danger:#b86a65}
  html,body{background:linear-gradient(180deg,#f6faf9 0,#ffffff 72%);color:var(--ink)}
  .topbar{background:linear-gradient(135deg,#365e69,#6caeb0);border-bottom:2px solid #e8c8ac}
  .topbar .brand span{color:#edf9f8}.icon-btn{background:#ffffff2b}.shell{background:transparent}
  .card,.answer{box-shadow:0 8px 24px rgba(58,105,112,.08)}
  .question{background:linear-gradient(135deg,#72adb0,#4d9098);box-shadow:0 5px 13px rgba(57,119,128,.15)}
  .send{background:linear-gradient(145deg,#5ea5aa,#3e858f)}
  .composer-wrap{background:linear-gradient(transparent,#f6faf9 24%)}.welcome{border-top-color:#e8c8ac}
  .eyebrow{background:#edf7f6;color:#397f8b}.answer .md strong{color:#2d6975}
  .suggestions button{border-color:#dceeee;background:#f7fbfb;color:#397f8b}.suggestions button:before{color:#d9a27f}
  .pref-quick,.clear-quick{box-shadow:0 3px 10px rgba(58,105,112,.08)}
  .detail-toggle{border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:#f7fbfb;color:var(--green);font-size:12px;font-weight:700}
  .location-detail{width:89%;max-width:89%;padding:12px 13px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 13px rgba(58,105,112,.06)}
  .location-detail[hidden]{display:none!important}.location-detail h3{margin:0 0 8px;font-size:14px;color:var(--forest)}
  .location-detail table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}.location-detail th,.location-detail td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}.location-detail th{background:#edf7f6;color:var(--forest)}.location-detail tr:last-child td{border-bottom:0}
  .location-detail .level-1{color:#a94b4b;background:#f9e8e6}.location-detail .level-2{color:#9a7832;background:#fbf3d9}.protection-badge{display:inline-block;margin-right:4px;padding:2px 5px;border-radius:5px;font-size:10px;font-weight:700}
  .detail-collapse{display:block;width:100%;margin-top:10px;border:0;border-radius:9px;padding:7px;background:#f4f8f7;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo"><img src="kingfisher.png" alt="翠鸟"></div><div><strong>AI 观鸟</strong><span>你的随身观鸟顾问</span></div></div>
    <div class="menu" id="menuBox" hidden><button class="icon-btn" aria-label="设置" onclick="toggleMenu()">⋯</button><div class="menu-panel" id="menuPanel" hidden><button onclick="openPreferences()">观鸟偏好设置</button><button onclick="clearChat()">清空对话</button><button onclick="changeKey()">更换 API Key</button></div></div>
  </header>
  <main class="shell">
    <section id="setup" class="card setup" hidden>
      <span class="eyebrow">🔐 首次使用</span>
      <h1>连接 DeepSeek<br>开始 AI 观鸟</h1>
      <p class="lead">请输入你的 DeepSeek API Key。保存后即可用自然语言查询观鸟记录中心的真实公开记录。</p>
      <div class="key-form">
        <div class="key-wrap"><input class="input" id="key" type="password" placeholder="请输入 API Key" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="show-key" onclick="toggleKey()">显示</button></div>
        <button class="primary" onclick="saveKey()">保存并开始对话</button>
        <div id="keyError" class="error"></div>
        <div class="privacy"><span>🛡️</span><span>Key 经 Android 系统密钥库加密后仅保存在本机，不会出现在聊天记录中。</span></div>
      </div>
    </section>
    <section id="chatPage" hidden>
      <div class="chat-head"><div><h1>想去哪里观鸟？</h1><div class="sub" id="preferenceHint">AI 自动查询观鸟记录中心 · 保留最近 10 组问答</div></div><div class="eyebrow" id="historyCount">0 / 10</div></div>
      <div id="messages" class="messages"></div>
      <div class="composer-wrap"><div class="composer-tools"><div class="count" id="statusText"></div><div class="quick-actions"><button class="clear-quick" onclick="clearChat()">清空</button><button class="pref-quick" onclick="openPreferences()">⚙ 偏好</button></div></div><div class="composer"><textarea id="question" rows="1" placeholder="例如：这两天北京天坛有什么鸟？" oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea><button id="send" class="send" aria-label="发送" onclick="ask()">↑</button></div></div>
    </section>
  </main>
  <div id="captchaModal" class="overlay" hidden>
    <div class="card captcha-card"><span class="eyebrow">访问验证</span><h2>输入观鸟记录中心验证码</h2><p class="sub">验证通过后会自动继续刚才的 AI 查询。</p><div id="captchaLoading" class="captcha-loading">正在获取验证码…</div><img id="captchaImage" class="captcha-image" alt="验证码" hidden onclick="loadCaptcha()"><input id="captchaCode" class="input" maxlength="6" placeholder="输入图片中的验证码" autocapitalize="off" autocomplete="off"><div id="captchaError" class="error"></div><div class="captcha-actions"><button class="secondary" onclick="loadCaptcha()">换一张</button><button id="verifyButton" class="primary" onclick="verifyCaptcha()">验证并继续</button></div></div>
  </div>
  <div id="preferencesModal" class="overlay" hidden>
    <div class="card preferences-card"><span class="eyebrow">观鸟偏好</span><h2>设置默认地点</h2><p class="sub">本次问题明确写出的地点永远优先；未指定日期时固定查询最近 7 天。</p><div class="preferences-grid"><label>省 / 直辖市<input id="prefProvince" placeholder="例如：山东省"></label><label>城市<input id="prefCity" placeholder="例如：青岛市"></label><label>区县（可留空）<input id="prefDistrict" placeholder="例如：市南区"></label><label>黑名单用户（用逗号或换行分隔）<input id="prefBlacklist" placeholder="例如：叶子飞羽寻踪0804"></label></div><div id="preferencesError" class="error"></div><div class="preferences-actions"><button class="secondary" onclick="clearPreferences()">清空</button><button class="secondary" onclick="closePreferences()">取消</button><button class="primary" onclick="savePreferences()">保存</button></div></div>
  </div>
  <script>
    const $=id=>document.getElementById(id);let sending=false,lastQuestion='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function mdInline(value){return esc(value).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
    function markdown(value){const lines=String(value??'').replace(/\r\n?/g,'\n').split('\n'),out=[];let list='',i=0;const close=()=>{if(list){out.push('</'+list+'>');list=''}};const cells=line=>line.trim().replace(/^\||\|$/g,'').split('|').map(v=>v.trim());while(i<lines.length){const line=lines[i],trim=line.trim();if(/^```/.test(trim)){close();const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i].trim()))code.push(lines[i++]);if(i<lines.length)i++;out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue}if(trim.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){close();const head=cells(line);i+=2;const body=[];while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())body.push(cells(lines[i++]));out.push('<div class="md-table"><table><thead><tr>'+head.map(v=>'<th>'+mdInline(v)+'</th>').join('')+'</tr></thead><tbody>'+body.map(row=>'<tr>'+row.map(v=>'<td>'+mdInline(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}const heading=trim.match(/^(#{1,3})\s+(.+)$/);if(heading){close();const level=heading[1].length;out.push('<h'+level+'>'+mdInline(heading[2])+'</h'+level+'>');i++;continue}const bullet=trim.match(/^[-*+]\s+(.+)$/),ordered=trim.match(/^\d+[.)]\s+(.+)$/);if(bullet||ordered){const wanted=bullet?'ul':'ol';if(list!==wanted){close();list=wanted;out.push('<'+list+'>')}out.push('<li>'+mdInline((bullet||ordered)[1])+'</li>');i++;continue}close();if(!trim){i++;continue}if(/^([-*_])\1{2,}$/.test(trim)){out.push('<hr>');i++;continue}if(/^>\s?/.test(trim)){out.push('<blockquote>'+mdInline(trim.replace(/^>\s?/,''))+'</blockquote>');i++;continue}out.push('<p>'+mdInline(trim)+'</p>');i++}close();return '<div class="md">'+out.join('')+'</div>'}
    function rows(){try{return JSON.parse(Native.historyJson()||'[]')}catch(e){return[]}}
    function preferences(){try{return JSON.parse(Native.preferenceJson()||'{}')}catch(e){return{}}}
    function updatePreferenceHint(){const p=preferences(),place=[p.province,p.city,p.district].filter(Boolean).join('');$('preferenceHint').textContent=(place?'默认 '+place:'未设置默认地点')+' · 未指定日期时最近 7 天 · 本次问题优先'}
    function boot(){const ready=Native.hasKey();$('setup').hidden=ready;$('chatPage').hidden=!ready;$('menuBox').hidden=!ready;if(ready){render();updatePreferenceHint()}}
    function toggleKey(){const input=$('key');input.type=input.type==='password'?'text':'password';event.currentTarget.textContent=input.type==='password'?'显示':'隐藏'}
    function saveKey(){const error=Native.saveKey($('key').value);$('keyError').textContent=error;if(!error){$('key').value='';boot();setTimeout(()=>$('question').focus(),150)}}
    function render(){const data=rows();$('historyCount').textContent=data.length+' / 10';$('messages').innerHTML=data.length?data.map(item=>'<div class="exchange"><div class="bubble question">'+esc(item.question)+'</div><div class="bubble answer">'+markdown(item.answer)+'</div>'+(item.records_queried?'<div class="query-meta">✓ 已查询记录中心 · '+esc(item.query_summary||'真实公开数据')+'</div>':'')+'</div>').join(''):'<div class="card welcome"><img class="welcome-bird" src="kingfisher.png" alt="翠鸟"><strong>问我最近哪里能看到什么鸟</strong><p>我会自动纠正省市参数，查询观鸟记录中心的真实公开记录。</p><div class="suggestions"><button onclick="askSuggestion(\'青岛最近有什么值得看的鸟？\')">青岛最近有什么值得看的鸟？</button><button onclick="askSuggestion(\'这两天北京天坛有什么鸟？\')">这两天北京天坛有什么鸟？</button><button onclick="askSuggestion(\'最近杭州哪里记录的鸟种最多？\')">最近杭州哪里记录的鸟种最多？</button></div></div>';scrollBottom(false)}
    function suggestionButton(text){return '<button onclick="askSuggestion(decodeURIComponent(\''+encodeURIComponent(text)+'\'))">'+esc(text)+'</button>'}
    function detailHtml(item,index){const hiddenCommon=new Set(['喜鹊','乌鸦','夜鹭','苍鹭','黑水鸡','白骨顶','麻雀','白头鹎']);const locations=Array.isArray(item.location_details)?item.location_details.slice(0,5):[];if(!locations.length)return '';const rows=locations.map(location=>{const details=(Array.isArray(location.bird_details)&&location.bird_details.length?location.bird_details:(Array.isArray(location.bird_names)?location.bird_names.map(name=>({name,protection_level:''})):[])).filter(bird=>!hiddenCommon.has(String(bird.name||'').trim()));if(!details.length)return '';const birdHtml=details.map(bird=>{const level=bird.protection_level||'';const badge=level?'<span class="protection-badge '+(level==='Ⅰ级'?'level-1':'level-2')+'">'+esc(level)+'</span>':'';return badge+esc(bird.name||'-')}).join('、');return '<tr><td>'+esc(location.location||'-')+'</td><td>'+birdHtml+'</td></tr>'}).filter(Boolean).join('');if(!rows)return '';return '<button class="detail-toggle" onclick="toggleDetail(&quot;'+index+'&quot;)">查看前五地点详情</button><div class="location-detail" id="location-detail-'+index+'" hidden><h3>鸟种地点明细（保护级别优先）</h3><table><thead><tr><th>地点</th><th>鸟种（汇总）</th></tr></thead><tbody>'+rows+'</tbody></table><button class="detail-collapse" onclick="toggleDetail(&quot;'+index+'&quot;)">收回详情</button></div>'}
    function toggleDetail(index){const panel=$('location-detail-'+index);if(panel)panel.hidden=!panel.hidden}
    function render(){const data=rows();$('historyCount').textContent=data.length+' / 10';const p=preferences();const place=(p.city||p.province||'广州').replace(/市$/,'');const suggestions=[place+'最近两天有什么值得看的鸟？',place+'哪里适合观鸟，近期记录比较多？','最近7天'+place+'哪里记录的鸟种最多？'];$('messages').innerHTML=data.length?data.map((item,index)=>'<div class="exchange"><div class="bubble question">'+esc(item.question)+'</div><div class="bubble answer">'+markdown(item.answer)+'</div>'+(item.records_queried?'<div class="query-meta">✓ 已查询记录中心 · '+esc(item.query_summary||'真实公开数据')+'</div>'+detailHtml(item,index):'')+'</div>').join(''):'<div class="card welcome"><img class="welcome-bird" src="kingfisher.png" alt="翠鸟"><strong>问我最近哪里能看到什么鸟</strong><p>我会自动校正问题中的城市和省份，未指定日期时查询最近 7 天。</p><div class="suggestions">'+suggestions.map(suggestionButton).join('')+'</div></div>';scrollBottom(false)}
    function askSuggestion(text){$('question').value=text;ask()}
    function ask(){const q=$('question').value.trim();if(!q||sending)return;lastQuestion=q;sending=true;$('question').value='';autoGrow($('question'));$('send').disabled=true;$('statusText').textContent='AI 正在分析并查询记录';const welcome=$('messages').querySelector('.welcome');if(welcome)welcome.remove();$('messages').insertAdjacentHTML('beforeend','<div id="pending" class="exchange"><div class="bubble question">'+esc(q)+'</div><div class="bubble answer thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>');scrollBottom(true);Native.ask(q)}
    window.onAiResult=function(result){const pending=$('pending');if(result.captchaRequired){sending=false;$('statusText').textContent='需要完成观鸟记录中心访问验证';openCaptcha();return}sending=false;$('send').disabled=false;$('statusText').textContent='';if(result.ok){if(pending)pending.remove();render()}else{const answer=pending&&pending.querySelector('.answer');if(answer){answer.className='bubble answer failed';answer.textContent=result.error||'请求失败，请稍后重试'}scrollBottom(true)}$('question').focus()}
    function openCaptcha(){$('captchaModal').hidden=false;$('captchaCode').value='';$('captchaError').textContent='';loadCaptcha()}
    function loadCaptcha(){$('captchaLoading').hidden=false;$('captchaImage').hidden=true;$('captchaError').textContent='';Native.loadCaptcha()}
    window.onCaptchaLoaded=function(result){$('captchaLoading').hidden=true;if(result.ok){$('captchaImage').src=result.image;$('captchaImage').hidden=false;$('captchaCode').focus()}else{$('captchaError').textContent=result.error||'验证码获取失败'}}
    function verifyCaptcha(){const code=$('captchaCode').value.trim();if(!code){$('captchaError').textContent='请输入验证码';return}$('verifyButton').disabled=true;$('captchaError').textContent='正在验证…';Native.verifyCaptcha(code)}
    window.onCaptchaVerified=function(result){$('verifyButton').disabled=false;if(!result.ok){$('captchaError').textContent=result.error||'验证码不正确';loadCaptcha();return}$('captchaModal').hidden=true;$('captchaError').textContent='';retryQuestion()}
    function retryQuestion(){if(!lastQuestion)return;sending=true;$('send').disabled=true;$('statusText').textContent='验证通过，正在继续查询';const answer=$('pending')&&$('pending').querySelector('.answer');if(answer){answer.className='bubble answer thinking';answer.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span>'}Native.ask(lastQuestion)}
    function clearChat(){toggleMenu(false);try{Native.clearHistory();render()}catch(error){const status=$('statusText');status.textContent='清空失败，请重试';setTimeout(()=>{status.textContent=''},2600)}}
    function openPreferences(){toggleMenu(false);const p=preferences();$('prefProvince').value=p.province||'';$('prefCity').value=p.city||'';$('prefDistrict').value=p.district||'';$('prefBlacklist').value=(p.blacklist_users||[]).join(', ');$('preferencesError').textContent='';$('preferencesModal').hidden=false;setTimeout(()=>$('prefProvince').focus(),80)}
    function closePreferences(){$('preferencesModal').hidden=true;$('preferencesError').textContent=''}
    function savePreferences(){const error=Native.savePreferences($('prefProvince').value,$('prefCity').value,$('prefDistrict').value,$('prefBlacklist').value);$('preferencesError').textContent=error;if(!error){closePreferences();updatePreferenceHint()}}
    function clearPreferences(){const error=Native.savePreferences('','','','');$('preferencesError').textContent=error;if(!error){closePreferences();updatePreferenceHint()}}
    function changeKey(){toggleMenu(false);if(confirm('更换 API Key 后，已有问答仍会保留。是否继续？')){Native.resetKey();boot();setTimeout(()=>$('key').focus(),100)}}
    function toggleMenu(force){const panel=$('menuPanel');panel.hidden=typeof force==='boolean'?!force:!panel.hidden}
    function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
    function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}}
    function scrollBottom(smooth){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:smooth?'smooth':'auto'}),40)}
    document.addEventListener('click',e=>{if(!$('menuBox').contains(e.target))toggleMenu(false)});boot();
  </script>
</body>
</html>
