{% extends "base.html" %}

{% block title %}AI 观鸟问答{% endblock %}

{% block nav_right %}
<a href="/" class="nav-back"><i class="fas fa-arrow-left"></i> 返回主页</a>
{% endblock %}

{% block head_extra %}
<style>
    .chat-shell { max-width: 980px; margin: 0 auto; }
    .chat-title { margin-bottom: 16px; }
    .chat-title h1 { margin: 0 0 6px; font-size: 1.35rem; }
    .chat-title p { margin: 0; color: var(--text-muted); font-size: .88rem; }
    .chat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
    .messages { min-height: 440px; max-height: 62vh; overflow-y: auto; padding: 20px; background: #f8fafc; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: 10px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; color: #fff; background: #2563eb; border-bottom-right-radius: 3px; }
    .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--border-color); border-bottom-left-radius: 3px; }
    .msg.system { align-self: center; color: var(--text-muted); font-size: .82rem; background: transparent; }
    .composer { padding: 14px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: flex-end; }
    .composer textarea { flex: 1; min-height: 46px; max-height: 140px; resize: vertical; border: 1px solid var(--border-color); border-radius: 8px; padding: 11px 12px; font: inherit; outline: none; }
    .composer textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .composer button { min-height: 46px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font-weight: 700; cursor: pointer; }
    .composer button:disabled { opacity: .55; cursor: wait; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .suggestions button { border: 1px solid #bfdbfe; color: #1d4ed8; background: #eff6ff; border-radius: 999px; padding: 7px 11px; cursor: pointer; }
    .tool-note { margin-top: 12px; color: var(--text-muted); font-size: .8rem; }
</style>
{% endblock %}

{% block content %}
<div class="chat-shell">
    <div class="chat-title">
        <h1><i class="fas fa-comments" style="color:#2563eb;"></i> AI 观鸟问答</h1>
        <p>DeepSeek 会自动调用鸟种记录查询，再根据真实公开记录回答。</p>
    </div>
    <div class="chat-card">
        <div id="messages" class="messages">
            <div class="msg assistant">你好！我可以查询最近几天的鸟种记录。例如：这两天北京天坛有什么鸟？</div>
        </div>
        <div class="composer">
            <textarea id="question" placeholder="输入你的观鸟问题，例如：这两天北京天坛有什么鸟？" onkeydown="handleKey(event)"></textarea>
            <button id="sendButton" onclick="sendMessage()"><i class="fas fa-paper-plane"></i> 发送</button>
        </div>
    </div>
    <div class="suggestions">
        <button onclick="ask('这两天北京天坛有什么鸟？')">北京天坛最近有什么鸟</button>
        <button onclick="ask('最近一周北京有哪些地点有较多鸟种记录？')">北京最近一周鸟种排行</button>
        <button onclick="ask('这两天青岛有什么鸟？')">青岛最近有什么鸟</button>
    </div>
    <div class="tool-note">提示：首次使用前，请在“配置管理”中填写 DeepSeek API Key。</div>
</div>
<script>
    const chatHistory = [];
    const messagesEl = document.getElementById('messages');
    const questionEl = document.getElementById('question');
    const sendButton = document.getElementById('sendButton');

    function appendMessage(role, text) {
        const el = document.createElement('div');
        el.className = 'msg ' + role;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function ask(text) { questionEl.value = text; sendMessage(); }
    function handleKey(event) {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }
    }
    async function sendMessage() {
        const message = questionEl.value.trim();
        if (!message || sendButton.disabled) return;
        appendMessage('user', message);
        questionEl.value = '';
        sendButton.disabled = true;
        sendButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 查询中';
        try {
            const response = await fetch('/api/ai-bird-chat', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message, messages: chatHistory})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || '请求失败');
            appendMessage('assistant', data.answer || '没有返回答案');
            chatHistory.push({role: 'user', content: message}, {role: 'assistant', content: data.answer || ''});
            while (chatHistory.length > 10) chatHistory.shift();
        } catch (error) {
            appendMessage('system', '请求失败：' + error.message);
        } finally {
            sendButton.disabled = false;
            sendButton.innerHTML = '<i class="fas fa-paper-plane"></i> 发送';
            questionEl.focus();
        }
    }
</script>
{% endblock %}
