<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在登录 BossMgr</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .box {
            width: min(420px, calc(100vw - 40px));
            padding: 26px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.1rem;
        }

        p {
            margin: 0;
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>正在登录 BossMgr</h1>
        <p>即将打开 {{ login_page_url }}，并使用 {{ username }} 登录。</p>
    </div>

    <form id="loginForm" method="post" action="{{ login_action_url }}">
        <input type="hidden" name="newConsoleLogin" value="true">
        <input type="hidden" name="j_username" value="{{ username }}">
        <input type="hidden" name="j_password" value="{{ password }}">
        <input type="hidden" name="targetUrl" value="{{ page_url }}">
        <input type="hidden" name="redirectUrl" value="{{ page_url }}">
        <input type="hidden" name="returnUrl" value="{{ page_url }}">
        <input type="hidden" name="url" value="{{ page_url }}">
    </form>

    <script>
        document.getElementById('loginForm').submit();
    </script>
</body>
</html>
