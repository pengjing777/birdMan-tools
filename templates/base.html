<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}鸟友工具箱{% endblock %} | 鸟友工具箱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='15' y='15' width='70' height='70' rx='16' fill='%232563eb'/><rect x='30' y='30' width='40' height='40' rx='8' fill='white' opacity='0.9'/><rect x='40' y='40' width='20' height='20' rx='4' fill='%232563eb'/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --header-bg: #1e293b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .navbar {
            background: var(--header-bg);
            padding: 0 30px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
        }

        .navbar-brand span { font-weight: 200; opacity: 0.6; }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-back:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* 主体 */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary-color); color: white; justify-content: center; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }
        .btn-outline:hover { background: #f1f5f9; color: var(--text-main); }
        .btn-success { background: var(--success-color); color: white; }
        .btn-success:hover { background: #059669; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.4s ease; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <i class="fas fa-feather-pointed"></i> 鸟友工具箱 <span>| 观鸟助手</span>
        </a>
        {% block nav_right %}{% endblock %}
    </nav>

    <div class="main-content fade-in">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
