{% extends "base.html" %}

{% block title %}主页{% endblock %}

{% block head_extra %}
<style>
    .page-header {
        text-align: center;
        padding: 40px 0 20px;
    }

    .page-header h1 {
        font-size: 1.8rem;
        margin: 0 0 8px;
        color: var(--text-main);
    }

    .page-header p {
        color: var(--text-muted);
        margin: 0;
        font-size: 1rem;
    }

    .tool-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
        padding: 20px 0 40px;
    }

    .tool-card {
        background: var(--card-bg);
        border-radius: 14px;
        padding: 28px;
        cursor: pointer;
        transition: all 0.25s ease;
        border: 1px solid var(--border-color);
        position: relative;
        overflow: hidden;
    }

    .tool-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        border-color: transparent;
    }

    .tool-card:active {
        transform: translateY(-1px);
    }

    .tool-icon {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: white;
        margin-bottom: 18px;
        transition: transform 0.25s ease;
    }

    .tool-card:hover .tool-icon {
        transform: scale(1.08);
    }

    .tool-card h3 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        color: var(--text-main);
    }

    .tool-card p {
        margin: 0;
        font-size: 0.88rem;
        color: var(--text-muted);
        line-height: 1.6;
    }

    .tool-card .card-arrow {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--border-color);
        font-size: 1.2rem;
        transition: all 0.25s ease;
        opacity: 0;
    }

    .tool-card:hover .card-arrow {
        opacity: 1;
        right: 16px;
        color: var(--text-muted);
    }

    @media (max-width: 640px) {
        .tool-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-feather-pointed"></i> 鸟友工具箱</h1>
    <p>观鸟、记录与照片整理</p>
</div>

<div class="tool-grid">
    {% for tool in tools %}
    <div class="tool-card" onclick="navigate('{{ tool.id }}')">
        <div class="tool-icon" style="background: {{ tool.color }};">
            <i class="fas {{ tool.icon }}"></i>
        </div>
        <h3>{{ tool.name }}</h3>
        <p>{{ tool.description }}</p>
        <i class="fas fa-chevron-right card-arrow"></i>
    </div>
    {% endfor %}
</div>

<script>
    function navigate(toolId) {
        window.location.href = '/tools/' + toolId;
    }
</script>
{% endblock %}
